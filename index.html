<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestionnaire Chicago Bulls</title>
    <link rel="stylesheet" href="css/style.css">
    <script type="module" src="js/main.js"></script>
</head>

<body>
    <header>
        <h1>Chicago Bulls</h1>
        <p>Gestionnaire de l'effectif</p>
    </header>

    <main>
        <section>
            <h2>Ajouter un joueur</h2>
            <form id="formulaire-joueur">
                <div class="champs">
                    <div>
                        <label for="champ-prenom">Prénom</label>
                        <input type="text" id="champ-prenom" required>
                    </div>
                    <div>
                        <label for="champ-nom">Nom</label>
                        <input type="text" id="champ-nom" required>
                    </div>
                    <div>
                        <label for="champ-annee">Année de naissance</label>
                        <input type="number" id="champ-annee" min="1940" required>
                    </div>
                    <div>
                        <label for="champ-num">Numéro</label>
                        <input type="number" id="champ-num" min="0" max="99" required>
                    </div>
                    <div>
                        <label for="champ-poste">Poste</label>
                        <select id="champ-poste" required>
                            <option value="">Choisir un poste</option>
                            <option value="Meneur">Meneur</option>
                            <option value="Arrière">Arrière</option>
                            <option value="Ailier">Ailier</option>
                            <option value="Ailier fort">Ailier fort</option>
                            <option value="Pivot">Pivot</option>
                        </select>
                    </div>
                </div>
                <button type="submit">Ajouter</button>
                <p id="message-validation" aria-live="polite"></p>
            </form>
        </section>

        <section>
            <h2>Effectif</h2>
            <div class="recherche">
                <input type="search" id="recherche-joueur" placeholder="Rechercher un joueur">
                <select id="filtre-poste">
                    <option value="">Tous les postes</option>
                    <option value="Meneur">Meneur</option>
                    <option value="Arrière">Arrière</option>
                    <option value="Ailier">Ailier</option>
                    <option value="Ailier fort">Ailier fort</option>
                    <option value="Pivot">Pivot</option>
                </select>
            </div>
            <p id="compteur-joueurs"></p>
            <div id="liste-joueurs"></div>
        </section>

        <section>
            <h2>Statistiques</h2>
            <div class="statistiques">
                <p>Nombre de joueurs : <strong id="stat-nombre">0</strong></p>
                <p>Âge moyen : <strong id="stat-moyenne">-</strong></p>
                <p>Plus jeune : <strong id="stat-jeune">-</strong></p>
                <p>Plus âgé : <strong id="stat-age">-</strong></p>
                <p>Plus petit numéro : <strong id="stat-numero-min">-</strong></p>
                <p>Plus grand numéro : <strong id="stat-numero-max">-</strong></p>
            </div>
            <button id="bouton-reinitialiser" type="button" class="secondaire">Réinitialiser l'effectif</button>
        </section>
    </main>

    <footer>Projet JavaScript - DEUST WMI</footer>
</body>

</html>
